<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الطبيب | العيادة</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✚</span><span><b>شاشة الطبيب</b><small>إدارة حالات عيادتك</small></span></a><nav><button id="doctorLogout" class="nav-link hidden">تسجيل الخروج</button></nav></header><main class="admin-container"><section id="doctorLoginPanel" class="login-wrap"><div class="login-decoration"><span class="brand-mark big">✚</span><h1>مرحباً دكتور</h1><p>سجّل الدخول بحسابك الذي أنشأته إدارة العيادة.</p></div><form id="doctorLoginForm" class="login-card"><h2>دخول الطبيب</h2><label>اسم المستخدم / البريد الإلكتروني<input id="doctorEmail" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="doctorPass" type="password" required autocomplete="current-password"></label><button class="primary-btn full">دخول إلى عيادتي</button><div id="doctorLoginError" class="error-text"></div></form></section><section id="doctorDashboard" class="hidden"><div class="admin-welcome"><div><span class="eyebrow">عيادتي</span><h1 id="doctorWelcome">حالات المرضى</h1><p id="doctorInfo"></p></div><label>حالتي الآن<select id="availabilityToggle"><option value="true">موجود / أستقبل الحالات</option><option value="false">غير موجود</option></select></label></div><div class="stats-grid"><article class="stat-card"><span>قيد الانتظار</span><b id="doctorWaiting">0</b></article><article class="stat-card"><span>مكتملة</span><b id="doctorCompleted">0</b></article></div><div class="admin-tabs"><button class="tab active" data-doctor-filter="waiting">الحالات المنتظرة</button><button class="tab" data-doctor-filter="completed">الحالات المكتملة</button><button class="tab" data-doctor-filter="all">كل الحالات</button></div><section class="admin-card"><div class="card-heading"><div><h2>حالات عيادتي</h2><p>اختر «مكتملة» بعد الانتهاء لتظهر للزبون في حجوزاتي.</p></div><button id="doctorRefresh" class="secondary-btn">تحديث ↻</button></div><div class="table-wrap"><table><thead><tr><th>رقم الحالة</th><th>المراجع</th><th>الهاتف</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody id="doctorCases"></tbody></table></div></section></section></main><footer><span>شاشة الطبيب</span><span>حافظ على سرية بيانات المرضى</span></footer><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="doctor.js"></script></body></html>
